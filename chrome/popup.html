<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #FBFAF7;
      --surface: #FFFFFF;
      --surface-2: #F4F1EB;
      --surface-3: #EFEAE2;
      --ink: #1B1714;
      --ink-2: #5B544B;
      --ink-3: #9A9186;
      --line: #EAE4DA;
      --line-2: #E0D8CC;
      --accent: #C2603D;
      --accent-deep: #A84B2C;
      --accent-soft: #F7EBE3;
      --positive: #3C7A57;
      --positive-soft: #E7F0EA;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --ui: 'Hanken Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    html[data-theme="dark"] {
      --paper: #16120E;
      --surface: #211B15;
      --surface-2: #2A2219;
      --surface-3: #342A20;
      --ink: #F2ECE2;
      --ink-2: #B6AC9D;
      --ink-3: #8B8174;
      --line: #312920;
      --line-2: #3E3429;
      --accent: #D77A52;
      --accent-deep: #E89068;
      --accent-soft: #2F2118;
      --positive: #63B488;
      --positive-soft: #1E2A21;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background: var(--paper);
      font-family: var(--ui);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .pop {
      width: 392px;
      background: var(--surface);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    html[data-theme="dark"] .pop {
      box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 24px 50px -20px rgba(0, 0, 0, .6);
    }

    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: var(--accent);
    }

    /* Header */
    .hd {
      padding: 16px 24px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      flex: none;
      box-shadow: 0 2px 6px -2px rgba(120, 60, 30, .35);
    }

    .hd-txt {
      line-height: 1;
    }

    .brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .hd-sub {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
    }

    .beta {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: .02em;
    }

    .ver {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-3);
    }

    /* Body */
    .body {
      padding: 12px 24px 4px;
    }

    .sec {
      margin-top: 4px;
    }

    .sec+.sec {
      margin-top: 14px;
    }

    .sec-h {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 8px;
    }

    /* Segmented control */
    .seg {
      display: flex;
      gap: 3px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 3px;
    }

    .seg button {
      flex: 1;
      font-family: var(--ui);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 7px 0;
      cursor: pointer;
      transition: .16s;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
    }

    .seg button:hover {
      color: var(--ink);
    }

    .seg button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 2px 6px -3px rgba(40, 30, 20, .14);
    }

    html[data-theme="dark"] .seg button[aria-pressed="true"] {
      background: var(--surface-3);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }

    .field-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
      margin: 0 0 6px;
    }

    /* Toggle list */
    .opts {
      display: flex;
      flex-direction: column;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }

    .opt:first-child {
      border-top: none;
    }

    .opt-txt {
      flex: 1;
    }

    .opt-name {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -.005em;
    }

    .opt-desc {
      font-size: 11.5px;
      color: var(--ink-3);
      margin-top: 1px;
    }

    .sw {
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: var(--surface-3);
      position: relative;
      flex: none;
      transition: .18s;
      border: 1px solid var(--line-2);
    }

    .sw::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(40, 30, 20, .25);
      transition: .18s;
    }

    html[data-theme="dark"] .sw::after {
      background: #F2ECE2;
    }

    .opt[aria-checked="true"] .sw {
      background: var(--accent);
      border-color: var(--accent);
    }

    .opt[aria-checked="true"] .sw::after {
      transform: translateX(16px);
    }

    .opt[aria-disabled="true"] {
      opacity: .4;
      pointer-events: none;
    }

    /* Chips */
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .chip {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 9px;
      padding: 7px 0;
      text-align: center;
      cursor: pointer;
      transition: .15s;
    }

    .chip:hover {
      border-color: var(--ink-3);
    }

    .chip[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-deep);
    }

    /* Actions */
    .actions {
      padding: 12px 24px 10px;
      margin-top: 8px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .btn {
      font-family: var(--ui);
      font-weight: 600;
      font-size: 14px;
      border-radius: 11px;
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: .16s;
      border: 1px solid transparent;
      letter-spacing: -.01em;
      width: 100%;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px -2px rgba(168, 75, 44, .5);
    }

    .btn-primary:hover {
      background: var(--accent-deep);
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line-2);
    }

    .btn-ghost:hover {
      background: var(--surface-2);
    }

    .btn-ghost:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-text {
      background: transparent;
      color: var(--ink-2);
      padding: 7px 6px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      text-decoration: none;
    }

    .btn-text:hover {
      color: var(--accent-deep);
    }

    .btn-text:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* Status */
    #status {
      margin: 0 24px;
      font-size: 12px;
      min-height: 0;
      border-radius: 9px;
      line-height: 1.5;
      transition: .15s;
    }

    #status:not(:empty) {
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    #status.info {
      background: var(--surface-2);
      color: var(--ink-2);
    }

    #status.success {
      background: var(--positive-soft);
      color: var(--positive);
    }

    #status.error {
      background: var(--accent-soft);
      color: var(--accent-deep);
    }

    #status a {
      color: var(--accent-deep);
    }

    /* Footer */
    .foot {
      padding: 0 24px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--ink-3);
      font-size: 11px;
    }

    .foot svg {
      width: 13px;
      height: 13px;
      flex: none;
    }
  </style>
</head>

<body>
  <!-- Hidden form elements — popup.js reads these directly -->
  <select id="format" style="display:none">
    <option value="json">JSON</option>
    <option value="markdown">Markdown</option>
    <option value="obsidian">Obsidian</option>
    <option value="pdf">PDF</option>
    <option value="text">Plain text</option>
  </select>
  <select id="artifactFormat" style="display:none">
    <option value="original">Original</option>
    <option value="markdown">Markdown</option>
    <option value="text">Plain Text</option>
    <option value="json">JSON</option>
  </select>
  <input type="checkbox" id="includeChats" checked style="display:none">
  <input type="checkbox" id="includeThinking" style="display:none">
  <input type="checkbox" id="includeMetadata" style="display:none">
  <input type="checkbox" id="includeArtifacts" style="display:none">
  <input type="checkbox" id="extractArtifacts" style="display:none">
  <input type="checkbox" id="flattenArtifacts" style="display:none">

  <div class="pop">
    <div class="accent-bar"></div>

    <div class="hd">
      <img class="mark" src="icon48.png" alt="">
      <div class="hd-txt">
        <div class="brand" id="header-title">ClawdKit</div>
        <div class="hd-sub">
          <span class="beta">BETA</span>
          <span class="ver" id="header-version">v1.0.1</span>
        </div>
      </div>
    </div>

    <div class="body">
      <div class="sec">
        <div class="sec-h">Conversation</div>
        <div class="field-label">Format</div>
        <div class="seg" id="seg-format" role="group" aria-label="Chat format">
          <button data-value="json" aria-pressed="true">JSON</button>
          <button data-value="markdown" aria-pressed="false">Markdown</button>
          <button data-value="obsidian" aria-pressed="false">Obsidian</button>
          <button data-value="pdf" aria-pressed="false">PDF</button>
          <button data-value="text" aria-pressed="false">Text</button>
        </div>
        <div class="opts" style="margin-top:10px">
          <div class="opt" id="opt-includeChats" aria-checked="true" role="checkbox" tabindex="0">
            <div class="opt-txt">
              <div class="opt-name">Messages</div>
              <div class="opt-desc">The full conversation thread</div>
            </div>
            <div class="sw"></div>
          </div>
          <div class="opt" id="opt-includeThinking" aria-checked="false" role="checkbox" tabindex="0">
            <div class="opt-txt">
              <div class="opt-name">Extended thinking</div>
              <div class="opt-desc">Include reasoning blocks</div>
            </div>
            <div class="sw"></div>
          </div>
          <div class="opt" id="opt-includeMetadata" aria-checked="false" role="checkbox" tabindex="0">
            <div class="opt-txt">
              <div class="opt-name">Metadata</div>
              <div class="opt-desc">Model, timestamps, IDs</div>
            </div>
            <div class="sw"></div>
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-h">Artifacts</div>
        <div class="field-label">Format</div>
        <div class="seg" id="seg-artifactFormat" role="group" aria-label="Artifact format">
          <button data-value="original" aria-pressed="true">Original</button>
          <button data-value="markdown" aria-pressed="false">Markdown</button>
          <button data-value="text" aria-pressed="false">Text</button>
          <button data-value="json" aria-pressed="false">JSON</button>
        </div>
        <div class="field-label" style="margin-top:10px">Placement</div>
        <div class="chips">
          <div class="chip" id="chip-includeArtifacts" aria-pressed="false" role="checkbox" tabindex="0">Inline</div>
          <div class="chip" id="chip-extractArtifacts" aria-pressed="false" role="checkbox" tabindex="0">Nested</div>
          <div class="chip" id="chip-flattenArtifacts" aria-pressed="false" role="checkbox" tabindex="0">Flat</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="exportCurrent" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Export current conversation
      </button>
      <button id="exportAll" class="btn btn-ghost">Export all conversations</button>
      <button id="browseConversations" class="btn btn-text">Browse conversations →</button>
    </div>

    <div id="status"></div>

    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      Everything is processed locally. Nothing leaves your browser.
    </div>
  </div>

  <script src="popup-sync.js"></script>
  <script src="popup-theme.js"></script>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>

</html>
